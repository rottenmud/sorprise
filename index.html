`Bunn,

Another anniversary, and I still can't believe how far we've come. Thank you for every memory we've made, even the small ones: the random conversations, the laughing over nothing, the ordinary days that were better just because you were on the other end of the line.

This year wasn't always easy for you. I saw you carry things that were heavy, I saw the tired days and the ones that tried to break you down, and I watched you get back up anyway. Even with the distance between us, you still showed up. You still said goodnight. You still chose "us," every single day.

I don't say it enough, but you're the best thing that has ever happened to me. Thank you for being patient with me, and for staying, even when staying was the harder thing to do.

I hope we get more games, more late-night calls, more quiet nights, and the day there's finally no more distance left to cross. As long as we are together, I'm here. Always.

Happy anniversary, Bunn. I love you.

P.S. A few memories are still waiting out there. Let's go find them together someday.`,
`Bunn,

Not every memory of ours is perfect, and I'm not perfect either. I've forgotten things, I've gotten things wrong, and I'm sorry for the times I made the distance between us feel longer than it already was.

But I watched you go through a hard year, and I watched you still hold on to "us" through every bit of it. You stayed, even when it would've been so much easier to let go. My love hasn't gone anywhere. I choose you more now than I ever did. I'll keep learning, keep listening, and keep closing the distance one message, one call, one anniversary at a time.

Our story isn't finished. Some memories are still scattered out there, and we have so many new ones to make. And someday, no distance between us at all.

Happy anniversary, Bunn. I love you.

P.S. The machine still works. Go back and find the rest. They're waiting for you, and so am I.`,
`Bunn,

Every memory is back where it belongs. The day we started talking. The quiet days that felt like everything. The inside jokes we can't trace back. The late nights under the same moon. All the times you stayed. I hope you felt each one, because I did.

I want to say this plainly: thank you for being in my life, especially this year. It wasn't a gentle one for you. There were hardships you had to carry, days that asked more of you than they should have, and through all of it you still chose to stay close to me, even with the distance in between.

You make it okay to be myself. Because of you, I want to be a better person, for us, and for the day the distance finally ends.

So here's my promise, the same one the star carried: as long as we are together, no distance, no bad day, and no kind of "hard" gets to be a reason we stop. We talk it through, and we choose each other again tomorrow.

I'm looking forward to so many more anniversaries with you: more games, more late-night talks, more stories, more "still you." And one day, our first real hangout, no screen in between. Wherever we end up, I'll choose you.

Happy anniversary, Bunn. I love you. Always, and for as long as we are together.

P.S. The Heart Machine never needed power. It ran on you the whole time.`];

let ban=0,S,mode='title',P={x:240,y:200,d:0,fr:0},dq=[],cache={},fire=[],jv={x:0,y:0},keys={},au,mus=1,tm=0,ty;

function start(s){S=s||{a:0,x:240,y:200,f:{},sq:{}};P.x=S.x;P.y=S.y;mode='play';$('pnl').style.display='none';$('ctl').style.display=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window?'block':'none';fx();ac();ban=3;mkAmb();if(!s)say('A grey world. A silent machine. A voice whispers:','"If you want to find what was lost, follow the things that still remember."')}

function closeFl(){if(mode!='flash')return;if($('fh').style.visibility!='visible'){clearInterval(fty);$('fm').textContent=ftx;$('fh').style.visibility='visible';return}$('fl').style.display='none';mode='play';bloom=1;spark();spark();ring(P.x,P.y-8);setTimeout(()=>ring(P.x,P.y-8),250);noise(.6,.05,3000);tone(523,.8,.05,'triangle');setTimeout(()=>tone(784,.8,.05,'triangle'),150);if(M()==6)say('Every memory has returned. The Heart Chamber is calling you.')}
