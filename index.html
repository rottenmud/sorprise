<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Stole Our Monthsary?</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f3b;--ink2:#272c52;--paper:#fdf6f0;--pink:#ff8fa3;--tape:#ffd23f;--text:#2a2340;--muted:#6d6785;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:auto}
body{margin:0;background:var(--ink);color:var(--paper);font-family:'Special Elite','Courier New',monospace;font-size:17px;line-height:1.55;min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
main{max-width:640px;margin:0 auto;padding:18px 16px 64px}
h1,h2{font-family:'Caveat','Comic Sans MS',cursive;font-weight:700;margin:0}
h1{font-size:clamp(2.4rem,12vw,3.6rem);overflow-wrap:break-word;line-height:1;color:var(--pink)}
h2{font-size:1.9rem;color:var(--tape)}
.tape{background:var(--tape);color:var(--ink);padding:4px 12px;display:inline-block;transform:rotate(-2deg);font-size:.85rem;margin-bottom:14px}
.card{background:var(--paper);color:var(--text);padding:18px 20px;border-radius:3px;margin:16px 0;box-shadow:4px 5px 0 rgba(0,0,0,.35);transform:rotate(-.3deg);overflow-wrap:anywhere}
.card p{margin:0}
button{font:inherit;font-size:1rem;min-height:50px;flex:1 1 calc(50% - 10px);cursor:pointer;border:2px solid var(--pink);background:transparent;color:var(--paper);padding:10px 16px;border-radius:2px;transition:background .15s,color .15s}
button:active,button:focus-visible{background:var(--pink);color:var(--ink);outline:none}
@media (hover:hover){button:hover:not(:disabled){background:var(--pink);color:var(--ink)}}
button.done:active{background:transparent;color:#9aa0cf}
.row .wide,.row .primary:only-child{flex-basis:100%}
button:disabled{opacity:.4;cursor:not-allowed;background:transparent;color:var(--paper)}
button.done{border-color:#5d6394;color:#9aa0cf}
.primary{background:var(--pink);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;color:#b9bde0;margin-bottom:6px}
.big{font-size:3rem;line-height:1.1}
.snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:9;flex:none;width:46px;min-height:46px;height:46px;padding:0;border-radius:50%;background:var(--ink2);font-size:1.2rem;line-height:1}
.msg p{margin:0 0 1em;font-family:'Caveat','Comic Sans MS',cursive;font-size:1.45rem;line-height:1.4;opacity:0;transform:translateY(8px);animation:in .8s forwards}
@keyframes in{to{opacity:1;transform:none}}
.stamp{font-size:1.5rem;color:var(--pink);border:3px solid var(--pink);display:inline-block;padding:2px 12px;transform:rotate(-6deg);margin:6px 0}
@media (prefers-reduced-motion:reduce){.msg p{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<button class="snd" id="snd" aria-label="Toggle sound" onclick="toggleSound()">🔊</button>
<main id="app"></main>
<script>
const rooms = {
  "Living Room": [
    ["Sofa cushion", "Cat hair everywhere. Suspicious! But the cat was asleep for 16 hours straight. Solid alibi."],
    ["Wall calendar", "The date is still there. Nothing was skipped. It's a calendar. It just sits there."]
  ],
  "Kitchen": [
    ["Fridge", "A half-eaten snack with mysterious bite marks. Evidence points to 'that one friend'. Unrelated to the case, but rude."],
    ["Coffee mug", "Still warm. Whoever was here needed caffeine, not a crime."]
  ],
  "Bedroom": [
    ["Phone", "'Happy monthsary' typed and deleted four times. Nothing stolen. Just nervous thumbs."],
    ["Pillow", "A small heart-shaped dent. An unused arrow nearby. Cupid was on his lunch break."]
  ],
  "Balcony": [
    ["Footprints", "Size: yours. Destination: the kitchen, for snacks. Case still open."],
    ["Night sky", "Nothing missing up there. Still pretty. Still there. Just like someone."]
  ]
};
const suspects = {
  "You": "Tempting to blame myself. But I'm right here, making a silly game for you. Guilty of being late sometimes, not guilty of theft.",
  "Her": "Busy passing things, trying to get better, and still cute while doing it. Not a thief. Case notes say: needs rest.",
  "The cat": "Alibi: asleep. Also asleep. And also asleep. Released with a treat.",
  "The calendar": "It only shows the days. It doesn't steal them. Released without charge.",
  "Cupid": "Arrow unused, on break. Says he's still rooting for you both.",
  "That one friend": "Ate the snacks, yes. But that's another case entirely."
};
const message = [
  "Happy monthsary Bun❤️",
  "Ang dami nang nangyari nitong August hanggang ngayon, and alam ko rin na marami akong naging pagkukulang at mga nagawa na nakasakit sau. I’m really sorry, bun. Sorry sa mga pagkakataon na hindi kita naintindihan at nde inintindi, sa mga nagawa ko na nakadagdag sa bigat na nararamdaman mo, at sa mga pagkakamali ko. Hindi ko man mababawi agad lahat, gusto kong matuto at ayusin yung mga mali ko.",
  "Ngayong monthsary natin, wish ko lang na mapasa mo lahat ng kailangan mong ipasa at gumaling ka na rin. Alam kong marami ka ring pinagdadaanan ngayon, kaya sana maging okay ka and please take care of yourself palagi.",
  "Sa relationship natin, sana maging okay tayo. Alam kong hindi naman laging smooth, pero ayoko rin sumuko sa atin. Gusto ko pa rin ayusin kung ano man yung kailangan ayusin, and sana magpatuloy pa rin tayo kahit may mga pagkakamali at misunderstandings.",
  "Happy monthsary ulit, bun. Thank you sa lahat, and I’m sorry sa mga pagkukulang ko. I love you. ❤️"
];

let ctx, muted = false;
function ac() {
  if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
function tone(f, t = 0, d = .2, type = "sine", v = .12) {
  if (muted) return;
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), st = c.currentTime + t;
  o.type = type; o.frequency.setValueAtTime(f, st);
  g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(v, st + .01); g.gain.exponentialRampToValueAtTime(.0001, st + d);
  o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + d + .05);
}
const sfx = {
  tap() { tone(520, 0, .08, "triangle", .1); },
  room() { tone(400, 0, .07, "square", .04); },
  clue() { tone(660, 0, .15, "triangle"); tone(990, .1, .25, "triangle"); },
  unlock() { [523, 659, 784].forEach((f, i) => tone(f, i * .1, .25, "triangle", .12)); },
  clear() { tone(330, 0, .15, "sawtooth", .05); tone(247, .13, .3, "sawtooth", .05); },
  reveal() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .45, "triangle", .14)); },
  melody() { [659, 784, 880, 988, 1175].forEach((f, i) => { tone(f, i * 1.2, 1.1, "sine", .09); tone(f / 2, i * 1.2, 1.1, "sine", .05); }); }
};
function toggleSound() {
  muted = !muted;
  document.getElementById("snd").textContent = muted ? "🔇" : "🔊";
  if (!muted) sfx.tap();
}

const total = Object.values(rooms).reduce((n, r) => n + r.length, 0);
let s = { view: "intro", room: "Living Room", found: {}, cleared: {}, note: "" };
const app = document.getElementById("app");
const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const count = o => Object.keys(o).length;

function render() {
  if (s.view === "intro") {
    app.innerHTML = `<span class="tape">CASE #001 · OPEN</span>
      <h1>Who Stole Our Monthsary?</h1>
      <div class="card"><p>Breaking news: the monthsary celebration has vanished without a trace. No cake. No candles. No confetti.</p>
      <p style="margin-top:10px">Only one person can crack this case. Detective Bun, please report for duty.</p></div>
      <div class="row"><button class="primary" onclick="go('search')">Accept the case</button></div>`;
  } else if (s.view === "search") {
    const list = rooms[s.room];
    const tabs = Object.keys(rooms).map(r => `<button class="${r === s.room ? 'primary' : ''}" onclick="room('${r}')">${r}</button>`).join("");
    const items = list.map((it, i) => {
      const k = s.room + i;
      return `<button class="${s.found[k] ? 'done' : ''}" onclick="inspect('${s.room}',${i})">${it[0]}${s.found[k] ? ' ✓' : ''}</button>`;
    }).join("");
    app.innerHTML = `<div class="bar"><span>Clues found: ${count(s.found)}/${total}</span></div>
      <div class="row">${tabs}</div>
      <h2>${s.room}</h2>
      <p>Tap to inspect the room:</p>
      <div class="row">${items}</div>
      <div class="card" id="note" style="min-height:90px"><p>${s.note ? esc(s.note) : "Tap something. Anything. You're the detective."}</p></div>
      <div class="row"><button class="primary" ${count(s.found) < total ? 'disabled' : ''} onclick="go('accuse')">Name the culprit</button></div>
      ${count(s.found) < total ? '<p style="color:#b9bde0;font-size:.85rem">Find every clue to unlock the accusation.</p>' : ''}`;
  } else if (s.view === "accuse") {
    const names = Object.keys(suspects);
    const allClear = count(s.cleared) === names.length;
    const btns = names.map(n => `<button class="${s.cleared[n] ? 'done' : ''}" ${s.cleared[n] ? 'disabled' : ''} onclick="accuse('${n}')">${n}</button>`).join("");
    app.innerHTML = `<h2>The suspects</h2>
      <p>Who stole the monthsary? Accuse carefully.</p>
      <div class="row">${btns}</div>
      <div class="card" id="note" style="min-height:90px"><p>${s.note ? esc(s.note) : "Tap a suspect."}</p></div>
      ${allClear ? `<p>Everyone has an alibi. Which means...</p><div class="row"><button class="primary" onclick="reveal()">Nobody?</button></div>` : ''}`;
  } else if (s.view === "reveal") {
    app.innerHTML = `<span class="tape">CASE CLOSED</span>
      <h1>WHO STOLE THE MONTHSARY?</h1>
      <div class="stamp">NOBODY.</div>
      <div class="card"><p class="big">💌</p><p>Because apparently we're still here.</p></div>
      <div class="row"><button class="primary" onclick="go('msg')">Open the case file</button></div>`;
  } else {
    app.innerHTML = `<span class="tape">EVIDENCE: ONE LETTER</span>
      <div class="msg">${message.map((p, i) => `<p style="animation-delay:${i * 1.2}s">${esc(p)}</p>`).join("")}</div>
      <div class="row"><button onclick="restart()">Replay the case</button></div>`;
  }
}
function go(v) { s.view = v; s.note = ""; render(); window.scrollTo(0, 0); if (v === "reveal") sfx.reveal(); else if (v === "msg") sfx.melody(); else sfx.tap(); }
function showNote() { const n = document.getElementById('note'); if (n) n.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
function room(r) { sfx.room(); s.room = r; s.note = ""; render(); }
function inspect(r, i) { const was = count(s.found); s.found[r + i] = true; (count(s.found) === total && was < total) ? sfx.unlock() : sfx.clue(); s.note = rooms[r][i][1]; render(); showNote(); }
function accuse(n) { sfx.clear(); s.cleared[n] = true; s.note = n + ": " + suspects[n]; render(); showNote(); }
function reveal() { go("reveal"); }
function restart() { s = { view: "intro", room: "Living Room", found: {}, cleared: {}, note: "" }; render(); window.scrollTo(0, 0); }
render();
</script>
</body>
</html>
